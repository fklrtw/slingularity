name: Deploy to GitHub Pages

on:
  push:
    tags:
      - 'v*'
  workflow_call:
  workflow_dispatch:

permissions: read-all

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run type checking
        run: npx tsc --noEmit

      - name: Run linting
        run: npx eslint .

      - name: Run tests with coverage
        run: npm run coverage

      - name: Build
        run: npm run build

      - name: Move coverage to dist
        run: mkdir -p dist/coverage && mv coverage/* dist/coverage/

      - name: Setup Pages
        uses: actions/configure-pages@1fb3643d0f0ee1629860608a2880479f2489fbd9 # v5.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@4803e4946307f08c3c432729a8a729e2898c634c # v3.0.2
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0fedffea45c1f0e # v4.0.5
